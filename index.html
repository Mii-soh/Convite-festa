  <style>

<body>


  <main class="convite">


    <div class="flores">
      🌻 🌼 🌻
    </div>


    <p class="subtitulo">
      Você está convidado(a) para comemorar
    </p>


    <h1>
      Meu aniversário
    </h1>


    <div class="numero">
      19
    </div>


    <div class="info">

      <strong>
        18 de outubro de 2026
      </strong>

      <br>

      A partir das <strong>09:00</strong>


      <div class="local">

        📍 <strong>Chã do Camará</strong>

        <br>

        <small>
          A localização será enviada pelo WhatsApp.
        </small>

      </div>

    </div>


    <!-- BOTÃO INICIAL -->

    <button
      class="botao"
      id="botaoConfirmar"
      onclick="confirmar()"
    >
      Confirmar presença 💛
    </button>


    <!-- ÁREA DE MENSAGEM -->

    <div
      class="mensagem"
      id="mensagem"
    >

      <h2 id="tituloMensagem"></h2>

      <div id="textoMensagem"></div>

    </div>


    <p class="rodape">
      Será um dia muito especial e quero você comigo! 🌻
    </p>


  </main>



  <script>


    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL =
      "https://uagltrjwjmjcpkadnvfi.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_ljFBfYwoZwGPF3bQQ48KUQ_i_hAQnX-";



    // =====================================================
    // VARIÁVEL DO CONVIDADO
    // =====================================================

    let convidadoAtual = null;



    // =====================================================
    // FUNÇÃO PRINCIPAL
    // =====================================================

    async function confirmar() {


      const botao =
        document.getElementById("botaoConfirmar");


      const mensagem =
        document.getElementById("mensagem");


      const titulo =
        document.getElementById("tituloMensagem");


      const texto =
        document.getElementById("textoMensagem");



      // Pega o token da URL

      const token =
        new URLSearchParams(
          window.location.search
        ).get("token");



      // =====================================================
      // VERIFICA SE EXISTE TOKEN
      // =====================================================

      if (!token) {

        titulo.textContent =
          "Link inválido 💛";


        texto.textContent =
          "Este convite não possui um código de convidado.";


        mensagem.style.display =
          "block";


        return;
      }



      // =====================================================
      // BOTÃO DE CARREGAMENTO
      // =====================================================

      botao.disabled =
        true;


      botao.textContent =
        "Verificando...";



      try {


        // =====================================================
        // BUSCA O CONVIDADO
        // =====================================================

        const resposta =
          await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/buscar_convidado`,
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY
              },

              body: JSON.stringify({
                p_token: token
              })

            }
          );



        const dados =
          await resposta.json();



        console.log(
          "Resposta do Supabase:",
          dados
        );



        // =====================================================
        // VERIFICA SE ENCONTROU
        // =====================================================

        if (
          !resposta.ok ||
          !Array.isArray(dados) ||
          dados.length === 0
        ) {


          titulo.textContent =
            "Convidado não encontrado 💛";


          texto.textContent =
            "Verifique se o link do convite está correto.";


          mensagem.style.display =
            "block";


          botao.disabled =
            false;


          botao.textContent =
            "Confirmar presença 💛";


          return;

        }



        // =====================================================
        // GUARDA OS DADOS DO CONVIDADO
        // =====================================================

        convidadoAtual =
          dados[0];



        // =====================================================
        // QUANTIDADE DE PULSEIRAS
        // =====================================================

        const pulseiras =
          Number(convidadoAtual.pulseiras) || 1;



        // O convidado principal ocupa uma pulseira.
        // O restante são acompanhantes.

        const quantidadeAcompanhantes =
          Math.max(0, pulseiras - 1);



        // =====================================================
        // CRIA OS CAMPOS DE ACOMPANHANTES
        // =====================================================

        let camposAcompanhantes = "";



        if (quantidadeAcompanhantes > 0) {


          camposAcompanhantes += `

            <div class="acompanhantes">

              <h3>
                Quem irá com você? 👥
              </h3>

          `;



          for (
            let i = 1;
            i <= quantidadeAcompanhantes;
            i++
          ) {


            camposAcompanhantes += `

              <div class="campo">

                <label for="acompanhante${i}">
                  Nome do acompanhante ${i}
                </label>

                <input
                  type="text"
                  id="acompanhante${i}"
                  placeholder="Digite o nome"
                  autocomplete="off"
                >

              </div>

            `;

          }



          camposAcompanhantes += `

              <button
                class="botao botaoFinal"
                onclick="finalizarPresenca()"
              >
                Confirmar presença 💛
              </button>

            </div>

          `;


        } else {


          // =================================================
          // CASO NÃO TENHA ACOMPANHANTE
          // =================================================

          camposAcompanhantes = `

            <button
              class="botao botaoFinal"
              onclick="finalizarPresenca()"
            >
              Confirmar presença 💛
            </button>

          `;

        }



        // =====================================================
        // MOSTRA AS INFORMAÇÕES
        // =====================================================

        titulo.textContent =
          `Olá, ${convidadoAtual.nome}! 🌻`;



        texto.innerHTML = `

          <p>
            Seu convite possui
            <strong>
              ${pulseiras} pulseira(s)
            </strong>.
          </p>

          <br>

          <strong>
            Você irá à festa?
          </strong>

          <button
            class="botao opcao"
            onclick="mostrarAcompanhantes()"
          >
            💛 Sim, vou!
          </button>

          <button
            class="botao opcao"
            onclick="naoVou()"
          >
            🤍 Não vou!
          </button>

          <div
            id="areaAcompanhantes"
            style="display: none;"
          >
            ${camposAcompanhantes}
          </div>

        `;



        mensagem.style.display =
          "block";



        botao.textContent =
          "Convite encontrado ✓";

      }


      catch (erro) {


        console.error(
          "Erro:",
          erro
        );


        titulo.textContent =
          "Ops! 💛";


        texto.textContent =
          "Não foi possível acessar o convite. Tente novamente.";


        mensagem.style.display =
          "block";


        botao.disabled =
          false;


        botao.textContent =
          "Confirmar presença 💛";

      }

    }



    // =====================================================
    // MOSTRAR CAMPOS DE ACOMPANHANTES
    // =====================================================

    function mostrarAcompanhantes() {


      const area =
        document.getElementById(
          "areaAcompanhantes"
        );


      if (area) {

        area.style.display =
          "block";

      }

    }



    // =====================================================
    // PESSOA NÃO VAI
    // =====================================================

    function naoVou() {


      const titulo =
        document.getElementById(
          "tituloMensagem"
        );


      const texto =
        document.getElementById(
          "textoMensagem"
        );


      titulo.textContent =
        "Tudo bem! 💛";


      texto.innerHTML = `

        <p>
          Agradecemos por avisar.
          <br>
          Sentiremos sua falta! 🌻
        </p>

      `;

    }



    // =====================================================
    // FINALIZAR PRESENÇA
    // =====================================================

    function finalizarPresenca() {


      const titulo =
        document.getElementById(
          "tituloMensagem"
        );


      const texto =
        document.getElementById(
          "textoMensagem"
        );



      // Quantidade de pulseiras

      const pulseiras =
        Number(convidadoAtual.pulseiras) || 1;



      const quantidadeAcompanhantes =
        Math.max(0, pulseiras - 1);



      // =====================================================
      // VERIFICA OS NOMES
      // =====================================================

      const acompanhantes = [];



      for (
        let i = 1;
        i <= quantidadeAcompanhantes;
        i++
      ) {


        const campo =
          document.getElementById(
            `acompanhante${i}`
          );


        if (!campo) {
          continue;
        }


        const nome =
          campo.value.trim();



        // Se algum campo estiver vazio

        if (!nome) {


          campo.focus();


          alert(
            `Digite o nome do acompanhante ${i}.`
          );


          return;

        }



        acompanhantes.push(
          nome
        );

      }



      // =====================================================
      // MOSTRA A CONFIRMAÇÃO
      // =====================================================

      titulo.textContent =
        "Presença confirmada! 🌻";


      let mensagemAcompanhantes =
        "";



      if (
        acompanhantes.length > 0
      ) {


        mensagemAcompanhantes = `

          <br>

          <strong>
            Acompanhante(s):
          </strong>

          <br>

          ${acompanhantes
            .map(nome => `👤 ${nome}`)
            .join("<br>")}

        `;

      }



      texto.innerHTML = `

        <p class="sucesso">
          Que bom que você vai! 💛
        </p>

        <br>

        Sua presença foi confirmada.

        ${mensagemAcompanhantes}

        <br><br>

        Nos vemos no dia
        <strong>
          18 de outubro! 🌻
        </strong>

      `;

    }


  </script>


</body>

</html>
