<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu aniversário 💛</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
      background: #fff9df;
      color: #5f4b18;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }

    .convite {
      width: 100%;
      max-width: 520px;

      background: #fffdf3;

      border-radius: 25px;

      padding: 40px 25px;

      text-align: center;

      box-shadow:
        0 8px 30px rgba(100, 80, 20, 0.15);

      border: 2px solid #f2d36b;
    }

    .flores {
      font-size: 38px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 42px;
      color: #c79b18;
      margin-bottom: 8px;
    }

    .subtitulo {
      font-size: 21px;
      margin-bottom: 25px;
    }

    .numero {
      font-size: 70px;
      font-weight: bold;
      color: #d6aa1e;
      margin: 10px 0;
    }

    .info {
      font-size: 18px;
      line-height: 1.8;
      margin: 25px 0;
    }

    .local {
      margin-top: 15px;
    }

    .botao {
      display: inline-block;
      width: auto;
      border: none;
      background: #d9ad25;
      color: white;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.2s;
    }

    .botao:hover {
      transform: scale(1.03);
      background: #c49a19;
    }

    .botao:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .rodape {
      margin-top: 25px;
      font-size: 14px;
      opacity: 0.75;
    }

    .mensagem {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #fff5c7;
      border-radius: 18px;
      line-height: 1.6;
    }

    .mensagem h2 {
      color: #c79b18;
      margin-bottom: 10px;
    }

    .opcao {
      display: block;
      width: 100%;
      margin: 10px 0 0 0;
    }

    .acompanhantes {
      margin-top: 20px;
      text-align: left;
    }

    .acompanhantes h3 {
      text-align: center;
      color: #c79b18;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #5f4b18;
    }

    .campo input {
      width: 100%;
      padding: 13px 15px;
      border: 2px solid #f2d36b;
      border-radius: 12px;
      background: white;
      color: #5f4b18;
      font-size: 16px;
      font-family: Georgia, "Times New Roman", serif;
      outline: none;
    }

    .campo input:focus {
      border-color: #d9ad25;
      box-shadow:
        0 0 0 3px rgba(217, 173, 37, 0.15);
    }

    .botaoFinal {
      width: 100%;
      margin-top: 5px;
    }

    .sucesso {
      color: #6d7d1d;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <main class="convite">

    <div class="flores">
      🌻 🌼 🌻
    </div>

    <p class="subtitulo">
      Você está convidado(a) para comemorar
    </p>

    <h1>
      Meu aniversário
    </h1>

    <div class="numero">
      19
    </div>

    <div class="info">

      <strong>
        18 de outubro de 2026
      </strong>

      <br>

      A partir das <strong>09:00</strong>

      <div class="local">

        📍 <strong>Chã do Camará</strong>

        <br>

        <small>
          A localização será enviada pelo WhatsApp.
        </small>

      </div>

    </div>

    <button
      class="botao"
      id="botaoConfirmar"
      onclick="confirmar()"
    >
      Confirmar presença 💛
    </button>

    <div
      class="mensagem"
      id="mensagem"
    >

      <h2 id="tituloMensagem"></h2>

      <div id="textoMensagem"></div>

    </div>

    <p class="rodape">
      Será um dia muito especial e quero você comigo! 🌻
    </p>

  </main>

  <script>

    const SUPABASE_URL =
      "https://uagltrjwjmjcpkadnvfi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ljFBfYwoZwGPF3bQQ48KUQ_i_hAQnX-";

    let convidadoAtual = null;

    async function confirmar() {

      const botao =
        document.getElementById("botaoConfirmar");

      const mensagem =
        document.getElementById("mensagem");

      const titulo =
        document.getElementById("tituloMensagem");

      const texto =
        document.getElementById("textoMensagem");

      const token =
        new URLSearchParams(
          window.location.search
        ).get("token");

      if (!token) {

        titulo.textContent =
          "Link inválido 💛";

        texto.textContent =
          "Este convite não possui um código de convidado.";

        mensagem.style.display =
          "block";

        return;
      }

      botao.disabled =
        true;

      botao.textContent =
        "Verificando...";

      try {

        const resposta =
          await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/buscar_convidado`,
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
              },

              body: JSON.stringify({
                p_token: token
              })

            }
          );

        const dados =
          await resposta.json();

        console.log(
          "Resposta do Supabase:",
          dados
        );

        if (
          !resposta.ok ||
          !Array.isArray(dados) ||
          dados.length === 0
        ) {

          titulo.textContent =
            "Convidado não encontrado 💛";

          texto.textContent =
            "Verifique se o link do convite está correto.";

          mensagem.style.display =
            "block";

          botao.disabled =
            false;

          botao.textContent =
            "Confirmar presença 💛";

          return;
        }

        convidadoAtual =
          dados[0];

        const pulseiras =
          Number(convidadoAtual.pulseiras) || 1;

        const quantidadeAcompanhantes =
          Math.max(0, pulseiras - 1);

        if (
          convidadoAtual.status &&
          convidadoAtual.status !== "pendente"
        ) {

          if (
            convidadoAtual.status === "confirmado"
          ) {

            titulo.textContent =
              `Olá, ${convidadoAtual.nome}! 🌻`;

            texto.innerHTML = `

              <p class="sucesso">
                Sua presença já foi confirmada! 💛
              </p>

              <br>

              Sua resposta já foi registrada.

            `;

          } else {

            titulo.textContent =
              `Olá, ${convidadoAtual.nome}! 🌻`;

            texto.innerHTML = `

              <p>
                Você informou que não poderá comparecer.
              </p>

              <br>

              Sua resposta já foi registrada. 💛

            `;

          }

          mensagem.style.display =
            "block";

          botao.textContent =
            "Resposta registrada ✓";

          return;
        }

        let camposAcompanhantes = "";

        const acompanhantePermitido =
          convidadoAtual.acompanhante_permitido !== false;

        if (
          quantidadeAcompanhantes > 0 &&
          acompanhantePermitido
        ) {

          camposAcompanhantes += `

            <div class="acompanhantes">

              <h3>
                Quem irá com você? 👥
              </h3>

          `;

          for (
            let i = 1;
            i <= quantidadeAcompanhantes;
            i++
          ) {

            camposAcompanhantes += `

              <div class="campo">

                <label for="acompanhante${i}">
                  Nome do acompanhante ${i}
                </label>

                <input
                  type="text"
                  id="acompanhante${i}"
                  placeholder="Digite o nome"
                  autocomplete="off"
                >

              </div>

            `;

          }

          camposAcompanhantes += `

              <button
                type="button"
                class="botao botaoFinal"
                onclick="finalizarPresenca()"
              >
                Confirmar presença 💛
              </button>

            </div>

          `;

        } else {

          camposAcompanhantes = `

            <button
              type="button"
              class="botao botaoFinal"
              onclick="finalizarPresenca()"
            >
              Confirmar presença 💛
            </button>

          `;

        }

        titulo.textContent =
          `Olá, ${convidadoAtual.nome}! 🌻`;

        texto.innerHTML = `

          <p>
            Seu convite possui
            <strong>
              ${pulseiras} pulseira(s)
            </strong>.
          </p>

          <br>

          <strong>
            Você irá à festa?
          </strong>

          <button
            type="button"
            class="botao opcao"
            id="botaoSim"
            onclick="mostrarAcompanhantes()"
          >
            💛 Sim, vou!
          </button>

          <button
            type="button"
            class="botao opcao"
            id="botaoNao"
            onclick="naoVou()"
          >
            🤍 Não vou!
          </button>

          <div
            id="areaAcompanhantes"
            style="display: none;"
          >
            ${camposAcompanhantes}
          </div>

        `;

        mensagem.style.display =
          "block";

        botao.textContent =
          "Convite encontrado ✓";

      }

      catch (erro) {

        console.error(
          "Erro:",
          erro
        );

        titulo.textContent =
          "Ops! 💛";

        texto.textContent =
          "Não foi possível acessar o convite. Tente novamente.";

        mensagem.style.display =
          "block";

        botao.disabled =
          false;

        botao.textContent =
          "Confirmar presença 💛";

      }

    }

    function mostrarAcompanhantes() {

      const area =
        document.getElementById(
          "areaAcompanhantes"
        );

      const botaoSim =
        document.getElementById(
          "botaoSim"
        );

      const botaoNao =
        document.getElementById(
          "botaoNao"
        );

      if (area) {
        area.style.display =
          "block";
      }

      if (botaoSim) {
        botaoSim.style.display =
          "none";
      }

      if (botaoNao) {
        botaoNao.style.display =
          "none";
      }

    }

    async function naoVou() {

      const titulo =
        document.getElementById(
          "tituloMensagem"
        );

      const texto =
        document.getElementById(
          "textoMensagem"
        );

      const botao =
        document.getElementById(
          "botaoConfirmar"
        );

      const token =
        new URLSearchParams(
          window.location.search
        ).get("token");

      if (!token) {
        return;
      }

      titulo.textContent =
        "Registrando... 💛";

      texto.textContent =
        "Aguarde um instante.";

      try {

        const resposta =
          await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/confirmar_presenca`,
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
              },

              body: JSON.stringify({

                p_token: token,

                p_confirmado: false,

                p_acompanhante_nome: null

              })

            }
          );

        const dados =
          await resposta.json();

        console.log(
          "Resposta ao recusar:",
          dados
        );

        if (!resposta.ok) {

          throw new Error(
            JSON.stringify(dados)
          );

        }

        titulo.textContent =
          "Tudo bem! 💛";

        texto.innerHTML = `

          <p>
            Agradecemos por avisar.
            <br>
            Sentiremos sua falta! 🌻
          </p>

        `;

        botao.textContent =
          "Resposta registrada ✓";

        botao.disabled =
          true;

      }

      catch (erro) {

        console.error(
          "Erro ao registrar recusa:",
          erro
        );

        titulo.textContent =
          "Ops! 💛";

        texto.innerHTML = `

          <p>
            Não conseguimos salvar sua resposta.
          </p>

          <br>

          <p>
            Tente novamente.
          </p>

        `;

      }

    }

    async function finalizarPresenca() {

      const titulo =
        document.getElementById(
          "tituloMensagem"
        );

      const texto =
        document.getElementById(
          "textoMensagem"
        );

      const token =
        new URLSearchParams(
          window.location.search
        ).get("token");

      if (!token) {
        return;
      }

      const pulseiras =
        Number(convidadoAtual.pulseiras) || 1;

      const quantidadeAcompanhantes =
        Math.max(0, pulseiras - 1);

      const acompanhantes = [];

      for (
        let i = 1;
        i <= quantidadeAcompanhantes;
        i++
      ) {

        const campo =
          document.getElementById(
            `acompanhante${i}`
          );

        if (!campo) {
          continue;
        }

        const nome =
          campo.value.trim();

        if (!nome) {

          campo.focus();

          alert(
            `Digite o nome do acompanhante ${i}.`
          );

          return;

        }

        acompanhantes.push(
          nome
        );

      }

      const nomesAcompanhantes =
        acompanhantes.length > 0
          ? acompanhantes.join(", ")
          : null;

      titulo.textContent =
        "Registrando presença... 💛";

      texto.textContent =
        "Aguarde um instante.";

      try {

        const resposta =
          await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/confirmar_presenca`,
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
              },

              body: JSON.stringify({

                p_token: token,

                p_confirmado: true,

                p_acompanhante_nome:
                  nomesAcompanhantes

              })

            }
          );

        const dados =
          await resposta.json();

        console.log(
          "Resposta da confirmação:",
          dados
        );

        if (!resposta.ok) {

          throw new Error(
            JSON.stringify(dados)
          );

        }

        titulo.textContent =
          "Presença confirmada! 🌻";

        let mensagemAcompanhantes =
          "";

        if (
          acompanhantes.length > 0
        ) {

          mensagemAcompanhantes = `

            <br>

            <strong>
              Acompanhante(s):
            </strong>

            <br>

            ${acompanhantes
              .map(
                nome => `👤 ${nome}`
              )
              .join("<br>")}

          `;

        }

        texto.innerHTML = `

          <p class="sucesso">
            Que bom que você vai! 💛
          </p>

          <br>

          Sua presença foi confirmada.

          ${mensagemAcompanhantes}

          <br><br>

          Nos vemos no dia
          <strong>
            18 de outubro! 🌻
          </strong>

        `;

        const botao =
          document.getElementById(
            "botaoConfirmar"
          );

        botao.textContent =
          "Presença confirmada ✓";

        botao.disabled =
          true;

      }

      catch (erro) {

        console.error(
          "Erro ao salvar presença:",
          erro
        );

        titulo.textContent =
          "Ops! 💛";

        texto.innerHTML = `

          <p>
            Não conseguimos salvar sua confirmação.
          </p>

          <br>

          <p>
            Tente novamente.
          </p>

        `;

      }

    }

  </script>

</body>

</html>
