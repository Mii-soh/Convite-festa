<body>

  <main class="convite">

    <div class="flores">
      🌻 🌼 🌻
    </div>

    <p class="subtitulo">
      Você está convidado(a) para comemorar
    </p>

    <h1>
      Meu aniversário
    </h1>

    <div class="numero">
      19
    </div>

    <div class="info">

      <strong>
        18 de outubro de 2026
      </strong>

      <br>

      A partir das <strong>09:00</strong>

      <div class="local">

        📍 <strong>Chã do Camará</strong>

        <br>

        <small>
          A localização será enviada pelo WhatsApp.
        </small>

      </div>

    </div>

    <button
      class="botao"
      id="botaoConfirmar"
      onclick="confirmar()"
    >
      Confirmar presença 💛
    </button>

    <div
      class="mensagem"
      id="mensagem"
    >

      <h2 id="tituloMensagem"></h2>

      <div id="textoMensagem"></div>

    </div>

    <p class="rodape">
      Será um dia muito especial e quero você comigo! 🌻
    </p>

  </main>


  <script>

    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL =
      "https://uagltrjwjmjcpkadnvfi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ljFBfYwoZwGPF3bQQ48KUQ_i_hAQnX-";


    // =====================================================
    // VARIÁVEL DO CONVIDADO
    // =====================================================

    let convidadoAtual = null;


    // =====================================================
    // FUNÇÃO PRINCIPAL
    // =====================================================

    async function confirmar() {

      const botao =
        document.getElementById("botaoConfirmar");

      const mensagem =
        document.getElementById("mensagem");

      const titulo =
        document.getElementById("tituloMensagem");

      const texto =
        document.getElementById("textoMensagem");


      const token =
        new URLSearchParams(
          window.location.search
        ).get("token");


      if (!token) {

        titulo.textContent =
          "Link inválido 💛";

        texto.textContent =
          "Este convite não possui um código de convidado.";

        mensagem.style.display =
          "block";

        return;
      }


      botao.disabled =
        true;

      botao.textContent =
        "Verificando...";


      try {

        const resposta =
          await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/buscar_convidado`,
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY
              },

              body: JSON.stringify({
                p_token: token
              })

            }
          );


        const dados =
          await resposta.json();


        console.log(
          "Resposta do Supabase:",
          dados
        );


        if (
          !resposta.ok ||
          !Array.isArray(dados) ||
          dados.length === 0
        ) {

          titulo.textContent =
            "Convidado não encontrado 💛";

          texto.textContent =
            "Verifique se o link do convite está correto.";

          mensagem.style.display =
            "block";

          botao.disabled =
            false;

          botao.textContent =
            "Confirmar presença 💛";

          return;

        }


        convidadoAtual =
          dados[0];


        const pulseiras =
          Number(convidadoAtual.pulseiras) || 1;


        const quantidadeAcompanhantes =
          Math.max(0, pulseiras - 1);


        let camposAcompanhantes = "";


        if (
          quantidadeAcompanhantes > 0 &&
          convidadoAtual.acompanhante_permitido === true
        ) {

          camposAcompanhantes += `

            <div class="acompanhantes">

              <h3>
                Quem irá com você? 👥
              </h3>

          `;


          for (
            let i = 1;
            i <= quantidadeAcompanhantes;
            i++
          ) {

            camposAcompanhantes += `

              <div class="campo">

                <label for="acompanhante${i}">
                  Nome do acompanhante ${i}
                </label>

                <input
                  type="text"
                  id="acompanhante${i}"
                  placeholder="Digite o nome"
                  autocomplete="off"
                >

              </div>

            `;

          }


          camposAcompanhantes += `

              <button
                class="botao botaoFinal"
                onclick="finalizarPresenca()"
              >
                Confirmar presença 💛
              </button>

            </div>

          `;


        } else {

          camposAcompanhantes = `

            <button
              class="botao botaoFinal"
              onclick="finalizarPresenca()"
            >
              Confirmar presença 💛
            </button>

          `;

        }


        titulo.textContent =
          `Olá, ${convidadoAtual.nome}! 🌻`;


        texto.innerHTML = `

          <p>
            Seu convite possui
            <strong>
              ${pulseiras} pulseira(s)
            </strong>.
          </p>

          <br>

          <strong>
            Você irá à festa?
          </strong>

          <button
            class="botao opcao"
            onclick="mostrarAcompanhantes()"
          >
            💛 Sim, vou!
          </button>

          <button
            class="botao opcao"
            onclick="naoVou()"
          >
            🤍 Não vou!
          </button>

          <div
            id="areaAcompanhantes"
            style="display: none;"
          >
            ${camposAcompanhantes}
          </div>

        `;


        mensagem.style.display =
          "block";


        botao.textContent =
          "Convite encontrado ✓";

      }


      catch (erro) {

        console.error(
          "Erro:",
          erro
        );


        titulo.textContent =
          "Ops! 💛";

        texto.textContent =
          "Não foi possível acessar o convite. Tente novamente.";

        mensagem.style.display =
          "block";

        botao.disabled =
          false;

        botao.textContent =
          "Confirmar presença 💛";

      }

    }


    // =====================================================
    // MOSTRAR CAMPOS DE ACOMPANHANTES
    // =====================================================

    function mostrarAcompanhantes() {

      const area =
        document.getElementById(
          "areaAcompanhantes"
        );


      if (area) {

        area.style.display =
          "block";

      }

    }


    // =====================================================
    // PESSOA NÃO VAI
    // =====================================================

    async function naoVou() {

      const titulo =
        document.getElementById(
          "tituloMensagem"
        );

      const texto =
        document.getElementById(
          "textoMensagem"
        );


      try {

        const token =
          new URLSearchParams(
            window.location.search
          ).get("token");


        if (!token) {
          return;
        }


        titulo.textContent =
          "Salvando... 💛";


        texto.textContent =
          "Aguarde um instante.";


        const resposta =
          await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/confirmar_presenca`,
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY
              },

              body: JSON.stringify({
                p_token: token,
                p_status: "recusado",
                p_acompanhante_nome: null
              })

            }
          );


        const resultado =
          await resposta.json();


        console.log(
          "Resultado da recusa:",
          resultado
        );


        if (!resposta.ok) {
          throw new Error(
            "Não foi possível salvar."
          );
        }


        titulo.textContent =
          "Tudo bem! 💛";


        texto.innerHTML = `

          <p>
            Agradecemos por avisar.
            <br>
            Sentiremos sua falta! 🌻
          </p>

        `;

      }


      catch (erro) {

        console.error(
          "Erro ao salvar:",
          erro
        );


        titulo.textContent =
          "Ops! 💛";


        texto.innerHTML = `

          <p>
            Não conseguimos registrar sua resposta.
            <br>
            Tente novamente.
          </p>

        `;

      }

    }


    // =====================================================
    // FINALIZAR PRESENÇA
    // =====================================================

    async function finalizarPresenca() {

      const titulo =
        document.getElementById(
          "tituloMensagem"
        );

      const texto =
        document.getElementById(
          "textoMensagem"
        );


      if (!convidadoAtual) {

        alert(
          "Convidado não encontrado."
        );

        return;

      }


      const token =
        new URLSearchParams(
          window.location.search
        ).get("token");


      if (!token) {

        alert(
          "Token do convite não encontrado."
        );

        return;

      }


      const pulseiras =
        Number(convidadoAtual.pulseiras) || 1;


      const quantidadeAcompanhantes =
        Math.max(0, pulseiras - 1);


      const acompanhantes = [];


      if (
        quantidadeAcompanhantes > 0 &&
        convidadoAtual.acompanhante_permitido === true
      ) {

        for (
          let i = 1;
          i <= quantidadeAcompanhantes;
          i++
        ) {

          const campo =
            document.getElementById(
              `acompanhante${i}`
            );


          if (!campo) {
            continue;
          }


          const nome =
            campo.value.trim();


          if (!nome) {

            campo.focus();


            alert(
              `Digite o nome do acompanhante ${i}.`
            );


            return;

          }


          acompanhantes.push(
            nome
          );

        }

      }


      const nomesAcompanhantes =
        acompanhantes.length > 0
          ? acompanhantes.join(", ")
          : null;


      titulo.textContent =
        "Salvando sua confirmação... 💛";


      texto.innerHTML = `
        <p>
          Aguarde um instante...
        </p>
      `;


      try {

        const resposta =
          await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/confirmar_presenca`,
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY
              },

              body: JSON.stringify({

                p_token: token,

                p_status: "confirmado",

                p_acompanhante_nome:
                  nomesAcompanhantes

              })

            }
          );


        const resultado =
          await resposta.json();


        console.log(
          "Resultado da confirmação:",
          resultado
        );


        if (
          !resposta.ok ||
          !resultado ||
          resultado.sucesso !== true
        ) {

          throw new Error(
            "Não foi possível salvar a confirmação."
          );

        }


        titulo.textContent =
          "Presença confirmada! 🌻";


        let mensagemAcompanhantes =
          "";


        if (
          acompanhantes.length > 0
        ) {

          mensagemAcompanhantes = `

            <br>

            <strong>
              Acompanhante(s):
            </strong>

            <br>

            ${acompanhantes
              .map(nome => `👤 ${nome}`)
              .join("<br>")}

          `;

        }


        texto.innerHTML = `

          <p class="sucesso">
            Que bom que você vai! 💛
          </p>

          <br>

          Sua presença foi confirmada.

          ${mensagemAcompanhantes}

          <br><br>

          Nos vemos no dia
          <strong>
            18 de outubro! 🌻
          </strong>

        `;

      }


      catch (erro) {

        console.error(
          "Erro ao salvar presença:",
          erro
        );


        titulo.textContent =
          "Ops! 💛";


        texto.innerHTML = `

          <p>
            Não conseguimos salvar sua confirmação.
            <br><br>
            Tente novamente.
          </p>

        `;

      }

    }

  </script>

</body>

</html>
