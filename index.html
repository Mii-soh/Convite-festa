<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu aniversário 💛</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
      background: #fff9df;
      color: #5f4b18;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .convite {
      width: 100%;
      max-width: 520px;
      background: #fffdf3;
      border-radius: 25px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(100, 80, 20, 0.15);
      border: 2px solid #f2d36b;
    }

    .flores {
      font-size: 38px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 42px;
      color: #c79b18;
      margin-bottom: 8px;
    }

    .subtitulo {
      font-size: 21px;
      margin-bottom: 25px;
    }

    .numero {
      font-size: 70px;
      font-weight: bold;
      color: #d6aa1e;
      margin: 10px 0;
    }

    .info {
      font-size: 18px;
      line-height: 1.8;
      margin: 25px 0;
    }

    .local {
      margin-top: 15px;
    }

    .botao {
      display: inline-block;
      border: none;
      background: #d9ad25;
      color: white;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .botao:hover {
      transform: scale(1.03);
      background: #c49a19;
    }

    .rodape {
      margin-top: 25px;
      font-size: 14px;
      opacity: 0.75;
    }

    .mensagem {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #fff5c7;
      border-radius: 18px;
      line-height: 1.6;
    }

    .mensagem h2 {
      color: #c79b18;
      margin-bottom: 10px;
    }

    .erro {
      color: #9b5b00;
    }
  </style>
</head>

<body>

  <main class="convite">

    <div class="flores">🌻 🌼 🌻</div>

    <p class="subtitulo">
      Você está convidado(a) para comemorar
    </p>

    <h1>Meu aniversário</h1>

    <div class="numero">19</div>

    <div class="info">
      <strong>18 de outubro de 2026</strong><br>
      A partir das <strong>09:00</strong>

      <div class="local">
        📍 <strong>Chã do Camará</strong><br>
        <small>
          A localização será enviada pelo WhatsApp.
        </small>
      </div>
    </div>

    <button class="botao" id="botaoConfirmar" onclick="confirmar()">
      Confirmar presença 💛
    </button>

    <div class="mensagem" id="mensagem">
      <h2 id="tituloMensagem"></h2>
      <p id="textoMensagem"></p>
    </div>

    <p class="rodape">
      Será um dia muito especial e quero você comigo! 🌻
    </p>

  </main>

  <script>
    const SUPABASE_URL =
      "https://uagltrjwjmjcpkadnvfi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ljFBfYwoZwGPF3bQQ48KUQ_i_hAQnX-";


    async function confirmar() {

      const botao = document.getElementById("botaoConfirmar");
      const mensagem = document.getElementById("mensagem");
      const titulo = document.getElementById("tituloMensagem");
      const texto = document.getElementById("textoMensagem");

      const token =
        new URLSearchParams(window.location.search).get("token");


      if (!token) {

        titulo.textContent = "Link inválido 💛";
        texto.textContent =
          "Este convite não possui um código de convidado.";

        mensagem.style.display = "block";

        return;
      }


      botao.disabled = true;
      botao.textContent = "Verificando...";


      try {

     const resposta = await fetch(
  `${SUPABASE_URL}/rest/v1/rpc/buscar_convidado`,
  {
    method: "POST",

    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY
    },

    body: JSON.stringify({
      p_token: token
    })
  }
);

const dados = await resposta.json();

if (!resposta.ok || !dados.length) {

  titulo.textContent = "Convidado não encontrado 💛";

  texto.textContent =
    "Verifique se o link do convite está correto.";

  mensagem.style.display = "block";

  botao.disabled = false;
  botao.textContent = "Confirmar presença 💛";

  return;
}

const convidado = dados[0];

titulo.textContent =
  `Olá, ${convidado.nome}! 🌻`;

texto.textContent =
  `Seu convite possui ${convidado.pulseiras} pulseira(s). Sua resposta foi encontrada com sucesso.`;

mensagem.style.display = "block";

botao.textContent = "Convite encontrado ✓";


      } catch (erro) {

        console.error(erro);

        titulo.textContent = "Ops! 💛";

        texto.textContent =
          "Não foi possível acessar o convite. Tente novamente.";

        mensagem.style.display = "block";

        botao.disabled = false;
        botao.textContent = "Confirmar presença 💛";
      }
    }
  </script>

</body>
</html>
